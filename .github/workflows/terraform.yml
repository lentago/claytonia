name: terraform

# No `paths:` filter on pull_request — deliberate, and load-bearing. The `gate`
# job below is a required status check, and a required check whose workflow never
# triggers is held "Expected" forever, deadlocking every non-terraform PR (the hard
# rule in lentago/.github fleet-ops/required-checks.json). Path filtering moves to
# the `changes` detector job instead, so the workflow always reports a conclusion
# while the expensive jobs still skip when no terraform changed. `push` keeps its
# filter: apply is not a required check and only needs to run on real changes.
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write # OIDC → AWS for the S3 state backend (plan + apply jobs)

env:
  # OIDC role (least-privilege: this repo's S3 state key + the lock table only).
  AWS_ROLE: arn:aws:iam::365184644049:role/claytonia-github-actions-terraform
  AWS_REGION: us-east-1

jobs:
  # Replaces the former `on:`-level path filter. On a PR, decide whether terraform
  # actually changed; on push the filter above already guaranteed it, so report true.
  changes:
    runs-on: ubuntu-latest
    outputs:
      tf: ${{ steps.filter.outputs.tf }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Detect terraform changes
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "tf=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed=$(git diff --name-only "$BASE_SHA" HEAD)
          echo "changed files:"; echo "$changed"
          if echo "$changed" | grep -qE '^terraform/|^\.github/workflows/terraform\.yml$'; then
            echo "tf=true" >> "$GITHUB_OUTPUT"
          else
            echo "tf=false" >> "$GITHUB_OUTPUT"
          fi

  validate:
    needs: changes
    if: needs.changes.outputs.tf == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.14.9"
          terraform_wrapper: false

      - name: fmt
        run: terraform fmt -check -recursive

      - name: init (no backend)
        run: terraform init -backend=false -input=false

      - name: validate
        run: terraform validate -no-color

  # plan + apply run on the LAN runner (LXC 115 gha-runner on pve4): the
  # Proxmox API is LAN-only, unreachable from GitHub-hosted runners.
  plan:
    needs: [changes, validate]
    runs-on: [self-hosted, lan]
    # Same-repo PRs only: fork PRs must never reach the LAN runner (defense
    # in depth alongside the repo's require-approval-for-all-outside-
    # collaborators Actions setting).
    if: >-
      needs.changes.outputs.tf == 'true' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    defaults:
      run:
        working-directory: terraform
    env:
      PROXMOX_VE_API_TOKEN: ${{ secrets.PROXMOX_VE_API_TOKEN }}
      # Trust the PVE Cluster Manager CA (provider verifies the API cert;
      # providers.tf sets insecure = false). SSL_CERT_DIR keeps system roots
      # for the AWS S3 backend; SSL_CERT_FILE adds the committed PVE root CA.
      SSL_CERT_DIR: /etc/ssl/certs
      SSL_CERT_FILE: ${{ github.workspace }}/terraform/pve-root-ca.pem
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Verify Proxmox secret
        run: |
          if [ -z "${PROXMOX_VE_API_TOKEN:-}" ]; then
            echo "::error::Set repository secret PROXMOX_VE_API_TOKEN (see terraform/README.md § Auth). It was empty in this run."
            exit 1
          fi

      - name: Configure AWS credentials (OIDC → S3 state)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ env.AWS_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.14.9"
          terraform_wrapper: false

      - name: init
        run: terraform init -input=false

      - name: plan
        id: plan
        continue-on-error: true
        run: |
          set -o pipefail
          terraform plan -no-color -input=false -lock=false \
            -out=tfplan 2>&1 | tee plan.txt
          PLAN_EXIT=${PIPESTATUS[0]}
          {
            echo 'plan<<EOF'
            tail -c 60000 plan.txt
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          exit "$PLAN_EXIT"

      - name: comment on PR
        if: always()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          PLAN: ${{ steps.plan.outputs.plan }}
          OUTCOME: ${{ steps.plan.outcome }}
        with:
          script: |
            const plan = process.env.PLAN || '(no plan output captured)';
            const outcome = process.env.OUTCOME;
            const body = [
              `### terraform plan (${outcome})`,
              '```',
              plan,
              '```',
            ].join('\n');
            return github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Fail if terraform plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1

  apply:
    needs: [changes, validate]
    runs-on: [self-hosted, lan]
    if: >-
      needs.changes.outputs.tf == 'true' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Serialize applies so two quick merges can't race on the same state.
    concurrency:
      group: terraform-apply
      cancel-in-progress: false
    defaults:
      run:
        working-directory: terraform
    env:
      PROXMOX_VE_API_TOKEN: ${{ secrets.PROXMOX_VE_API_TOKEN }}
      # Trust the PVE Cluster Manager CA (provider verifies the API cert;
      # providers.tf sets insecure = false). SSL_CERT_DIR keeps system roots
      # for the AWS S3 backend; SSL_CERT_FILE adds the committed PVE root CA.
      SSL_CERT_DIR: /etc/ssl/certs
      SSL_CERT_FILE: ${{ github.workspace }}/terraform/pve-root-ca.pem
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Verify Proxmox secret
        run: |
          if [ -z "${PROXMOX_VE_API_TOKEN:-}" ]; then
            echo "::error::Set repository secret PROXMOX_VE_API_TOKEN (see terraform/README.md § Auth). It was empty in this run."
            exit 1
          fi

      - name: Configure AWS credentials (OIDC → S3 state)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ env.AWS_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.14.9"
          terraform_wrapper: false

      - name: init
        run: terraform init -input=false

      - name: apply
        run: terraform apply -auto-approve -no-color -input=false

  # Always-on fan-in so a single context can be required. NOT a no-op: it fails when
  # any upstream job reports failure or cancelled. A skipped job counts as passing,
  # which is what lets a non-terraform PR through while a red plan still blocks.
  gate:
    needs: [changes, validate, plan]
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Terraform gate
        run: |
          echo "changes=${{ needs.changes.result }} validate=${{ needs.validate.result }} plan=${{ needs.plan.result }}"
          for r in "${{ needs.changes.result }}" "${{ needs.validate.result }}" "${{ needs.plan.result }}"; do
            case "$r" in
              failure|cancelled)
                echo "::error::terraform gate blocked (a required job reported $r)"
                exit 1 ;;
            esac
          done
          echo "gate passed (success/skipped only)"
